<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAEEMUDDIN | Contact</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">ZAEEMUDDIN</div>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="videos.html">Videos</a>
        <a href="server.html">Server</a>
        <a href="downloads.html">Downloads</a>
        <a class="active" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <header class="page-header">
      <span class="tag">Contact</span>
      <h1>Send us a message</h1>
    </header>

    <section class="contact-layout">
      <div class="contact-detail">
        <h2>Get in touch</h2>
        <ul class="info-list">
          <li>Email: hello@zaeemuddin.com</li>
          <li>Discord: ZAEEMUDDIN</li>
          <li>Support hours: 9am–9pm</li>
        </ul>
      </div>

      <div class="form-card">
        <form id="contactForm" novalidate>
          <div class="form-group">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Your name">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com">
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Tell us how we can help"></textarea>
          </div>

          <div class="button-row">
            <button class="submit-btn" type="submit">Send message</button>
          </div>

          <div id="formStatus" class="status" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> ZAEEMUDDIN</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
